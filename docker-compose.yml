services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openhr
      POSTGRES_USER: openhr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhr -d openhr"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://openhr:${POSTGRES_PASSWORD}@db:5432/openhr
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
