# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the web service (Docker, with a persistent disk for receipts) and a Postgres database.
services:
  - type: web
    name: openhr
    runtime: docker
    plan: starter # persistent disks need a paid instance
    region: singapore
    healthCheckPath: /login
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openhr-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Your public URL, e.g. https://openhr.onrender.com (or a custom domain). Prompted on first deploy.
      - key: APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_NAME
        value: OpenHR
      - key: CURRENCY
        value: MYR
      - key: TZ_DISPLAY
        value: Asia/Kuala_Lumpur
      - key: WORKING_DAYS
        value: 1,2,3,4,5
      - key: DEMO_LOGIN
        value: "false"

databases:
  - name: openhr-db
    databaseName: openhr
    user: openhr
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
